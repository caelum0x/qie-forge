[package]
name = "qie-forge"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for the QIE blockchain — real chain/oracle clients and AMM quote math, mirroring @qie-forge/core"
license = "MIT"

[dependencies]
ethers = { version = "2", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
